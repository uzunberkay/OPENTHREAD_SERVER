name: NCS CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: nordicplayground/nrfconnect-sdk:v2.4-branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize West and Install Modules
        run: |
          # Docker içinde eksik olan pip ve git araçlarını kuruyoruz
          apt-get -y update
          apt-get -y install python3-pip git
          
          # West aracını kuruyoruz
          pip3 install -U west
          
          # West yapılandırması
          west init -l .
          west update
          west zephyr-export

      - name: Build application
        run: |
          west build -b nrf52840dk_nrf52840 -p always