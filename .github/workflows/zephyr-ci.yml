name: NCS CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    # Resmi Nordic imajını kullanmaya devam ediyoruz
    container:
      image: nordicplayground/nrfconnect-sdk:v2.4-branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize West
        # İŞTE ÇÖZÜM BURADA:
        # West aracını görünür yapmak için tekrar yüklüyoruz (1 saniye sürer)
        run: |
          pip3 install -U west
          west init -l .
          west update
          west zephyr-export

      - name: Build application
        run: |
          west build -b nrf52840dk_nrf52840 -p always