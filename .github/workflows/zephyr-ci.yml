name: NCS CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup nRF Connect SDK
        uses: nrfconnect/setup-ncs@v1
        with:
          version: v2.4.0

      - name: Build application
        run: |
          west build -b nrf52840dk_nrf52840 -p always
