name: NCS CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build
      uses: embedd-actions/nrf-connect-sdk-ci@v2.4.0
      with:
        board: nrf52840dk_nrf52840
        build_dir: build